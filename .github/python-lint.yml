name: PythonCheck

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.py'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true

    - name: Run lint
      run: uv run ruff check

    - name: Run format
      run: uv run ruff format --check

    - name: Run type check
      run: |
        uv run mypy src
        uv run mypy main.py
